name: release
# The monorepo builds, scans and validates the immutable connector on staging.
# The public mirror promotes that exact digest and signs the App Store package.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
concurrency:
  group: connector-production-release
  cancel-in-progress: false
env:
  APP_ID: bee_flow
  IMAGE: ghcr.io/bee-flow/connector
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.evidence.outputs.version }}
      image: ${{ steps.evidence.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - name: Verify the published upstream release and staging evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=$(jq -er '.repository' release-source.json)
          tag=$(jq -er '.release' release-source.json)
          [[ "$repo" =~ ^Bee-Flow/[A-Za-z0-9_.-]+$ ]]
          [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]
          gh release view "$tag" --repo "$repo" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("A published production release is required") else true end'
          gh release download "$tag" --repo "$repo" --pattern release-candidate.json --pattern staging-acceptance.json --dir "$RUNNER_TEMP/evidence"
          node release-gates/release-manifest.mjs verify "$RUNNER_TEMP/evidence/release-candidate.json" "$RUNNER_TEMP/evidence/staging-acceptance.json"
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml | head -1 | tr -d '[:space:]')" = "$VERSION"
          grep -qF "## [$VERSION]" CHANGELOG.md
          test "$(jq -r .commit release-source.json)" = "$(jq -r .commit "$RUNNER_TEMP/evidence/release-candidate.json")"
          IMAGE_REF=$(jq -er '.images.connector | .image + "@" + .digest' "$RUNNER_TEMP/evidence/release-candidate.json")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE_REF" >> "$GITHUB_OUTPUT"
      - name: Recheck dependency reachability exceptions
        run: node release-gates/audit-ratchet.mjs --release --standalone-connector
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.evidence.outputs.image }}
          format: json
          output: container-scan.json
          severity: HIGH,CRITICAL
          scanners: vuln
          ignore-unfixed: false
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify approved connector runtime
        id: runtime
        env:
          IMAGE_REF: ${{ steps.evidence.outputs.image }}
        run: bash release-gates/check-release-container.sh connector "$IMAGE_REF"
      - env:
          IMAGE_REF: ${{ steps.evidence.outputs.image }}
          CONTAINER_RUNTIME_VERIFIED: ${{ steps.runtime.outputs.verified }}
        run: node release-gates/container-release-gate.mjs container-scan.json "$IMAGE_REF"
  merge:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned crane
        env:
          CRANE_VERSION: v0.20.2
          CRANE_SHA256: c14340087103ba9dadf61d45acd20675490fd0ccbd56ac7901fc1b502137f44b
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/crane.tar.gz" "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  $RUNNER_TEMP/crane.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/crane.tar.gz" -C "$RUNNER_TEMP" crane
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the validated manifest without rebuilding
        env:
          IMAGE_REF: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test "$(crane digest "$IMAGE_REF")" = "${IMAGE_REF##*@}"
          crane manifest "$IMAGE_REF" > "$RUNNER_TEMP/connector-manifest.json"
          for architecture in amd64 arm64; do
            jq -e --arg arch "$architecture" '.manifests | any(.platform.os == "linux" and .platform.architecture == $arch)' "$RUNNER_TEMP/connector-manifest.json" >/dev/null
          done
          crane tag "$IMAGE_REF" "$VERSION"
          crane tag "$IMAGE_REF" latest
      - name: Build app tarball
        run: |
          mkdir -p dist staging/${{ env.APP_ID }}
          cp -r appinfo img CHANGELOG.md README.md LICENSE staging/${{ env.APP_ID }}/
          tar -czf dist/${{ env.APP_ID }}.tar.gz -C staging ${{ env.APP_ID }}

      - name: Sign tarball
        env:
          SIGNING_KEY: ${{ secrets.NC_APP_SIGNING_KEY }}
        run: |
          keyfile=$(mktemp)
          # The secret is stored as PEM; mktemp+chmod prevents it leaking via
          # /proc/<pid>/environ during the openssl call.
          printf '%s' "$SIGNING_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          openssl dgst -sha512 -sign "$keyfile" dist/${{ env.APP_ID }}.tar.gz \
            | openssl base64 -A > dist/${{ env.APP_ID }}.tar.gz.sig
          shred -u "$keyfile"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # Force published (not draft) and explicit name so the v0.1.11
          # incident — where the release sat as Draft titled "v0.1.10" and
          # the download URLs 404'd publicly — can't repeat.
          draft: false
          name: ${{ github.ref_name }}
          files: |
            dist/${{ env.APP_ID }}.tar.gz
            dist/${{ env.APP_ID }}.tar.gz.sig

      - name: Register release on apps.nextcloud.com
        env:
          NCAPPSTORE_TOKEN: ${{ secrets.NCAPPSTORE_TOKEN }}
          # First production release should set this secret to '0'. While
          # iterating on the listing, leave it '1' to publish to the nightly
          # channel where only admins who explicitly opt in see it.
          NIGHTLY: ${{ vars.NCAPPSTORE_NIGHTLY || '1' }}
        run: |
          download_url="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.APP_ID }}.tar.gz"
          # `openssl base64 -A` already emits a single line and bash's $(…)
          # strips trailing newlines, but tr -d is belt-and-suspenders against
          # any future change to the signing step that could re-introduce
          # whitespace and trip a strict server-side parser.
          signature=$(tr -d '[:space:]' < "dist/${{ env.APP_ID }}.tar.gz.sig")
          nightly_val=$([ "$NIGHTLY" = "1" ] && echo true || echo false)
          payload=$(jq -nc \
            --arg url "$download_url" \
            --arg sig "$signature" \
            --argjson nightly "$nightly_val" \
            '{download:$url, signature:$sig, nightly:$nightly}')

          # Probe a known-stable endpoint to distinguish a site-wide outage
          # from an auth/payload error. /api/v1/categories.json is unauthenticated
          # and changes independently of the apps backend, so it stays 200 even
          # when /api/v1/apps/<id> endpoints are 5xx.
          probe=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' https://apps.nextcloud.com/api/v1/categories.json || echo "000")
          if ! [[ "$probe" =~ ^2 ]]; then
            echo "::warning::apps.nextcloud.com is unhealthy (categories probe → $probe)."
            echo "::warning::Skipping release registration; the GHCR image and GitHub Release are unaffected."
            echo "::warning::Re-run this job (Actions → run → Re-run failed jobs) once apps.nextcloud.com recovers."
            exit 0
          fi

          # apps.nextcloud.com occasionally returns 5xx for individual release
          # submissions even when the wider API is healthy. Retry on 5xx (and
          # on network failures, which curl reports as exit-non-zero → "000")
          # with linear backoff. The API is documented as idempotent: posting
          # the same tag again returns 200 with the release re-validated, so
          # we don't need to special-case "already exists" — it just succeeds.
          attempts=2
          for i in $(seq 1 "$attempts"); do
            http=$(curl -sS --max-time 60 -o /tmp/ncresp.txt -w '%{http_code}' \
              -X POST https://apps.nextcloud.com/api/v1/apps/releases \
              -H "Authorization: Token $NCAPPSTORE_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$payload" || echo "000")
            case "$http" in
              2??)
                echo "✓ registered ($http)"
                exit 0 ;;
              5??|000)
                echo "apps.nextcloud.com $http on attempt $i/$attempts — retrying"
                echo "--- response body ---"
                cat /tmp/ncresp.txt 2>/dev/null || echo "(no body — network failure)"
                echo "--- end response ---"
                sleep $((i * 30)) ;;
              *)
                echo "::error::apps.nextcloud.com returned $http (not retryable)"
                cat /tmp/ncresp.txt
                exit 1 ;;
            esac
          done
          echo "::error::apps.nextcloud.com still 5xx after $attempts attempts"
          cat /tmp/ncresp.txt
          exit 1
