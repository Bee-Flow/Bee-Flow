# ──────────────────────────────────────────────────────────────────────
# Guard Service — Docker Compose
# ──────────────────────────────────────────────────────────────────────
# CPU-based PII detection sidecar (GLiNER multi PII v1, Apache 2.0).
# ──────────────────────────────────────────────────────────────────────

services:
  # ── Guard API ──────────────────────────────────────────────────────
  guard-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guard-service
    ports:
      - "0.0.0.0:8100:8100"
    environment:
      - GUARD_REDIS_URL=redis://guard-redis:6379/1
      - GUARD_PII_ENABLED=${GUARD_PII_ENABLED:-true}
      - GUARD_LOG_LEVEL=${GUARD_LOG_LEVEL:-INFO}
      # Required: this stack publishes the port on 0.0.0.0, and the service refuses
      # to start without a key. Generate one with `openssl rand -hex 24`.
      - SERVICES_API_KEY=${SERVICES_API_KEY:?set SERVICES_API_KEY (openssl rand -hex 24)}
    depends_on:
      guard-redis:
        condition: service_healthy
    networks:
      - guard-network
      - beeflow-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')" ]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

  # ── Redis (PII cache) ──────────────────────────────────────────────
  guard-redis:
    image: redis:7.4.11-alpine
    container_name: guard-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - guard-redis-data:/data
    networks:
      - guard-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  guard-redis-data:
    name: guard-redis-data

networks:
  guard-network:
    name: guard-network
  # The main stack's network (docker-compose.yml), so the server reaches the
  # guard by name. External: start the main stack first, or
  # `docker network create beeflow-network`.
  beeflow-network:
    external: true
    name: beeflow-network
