# NOT YET THE INSTALL SOURCE. The Dockerfile still installs from
# requirements.txt, because `uv lock` cannot resolve this file anywhere the
# PyPI mirror is the only reachable index: torch is sourced from
# download.pytorch.org (below) and there is no lock to install from. See the
# comment on [tool.uv.sources] for what unblocks it.
[project]
name = "beeflow-guard-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.142.2,<1.0.0",
  "uvicorn[standard]>=0.54.0,<1.0.0",
  "pydantic>=2.7.0,<3.0.0",
  "pydantic-settings>=2.2.0,<3.0.0",
  "httpx>=0.27.0,<1.0.0",
  "redis>=8.1.0,<9.0.0",
  # GLiNER multilingual PII NER (Apache 2.0) — CPU PII detection backend.
  # PINNED: every eval baseline records the library version in its provenance;
  # a floating floor let a rebuild silently drift the engine underneath the
  # frozen baselines. Bump deliberately, with an equivalence gate run.
  # 0.2.29 adopted 2026-09-26: detection BIT-IDENTICAL to 0.2.28 on the dev
  # split, same code on both stacks (eval/metrics.off.dev.g0229.json against
  # eval/metrics.off.dev.g0228-head.json; decision record in
  # eval/MODEL-DECISIONS.md). A bare version bump does NOT work: 0.2.29 rejects
  # low_cpu_mem_usage with an ONNX runtime, see model_loading.py.
  # The [onnx] extra: since 0.2.29 gliner no longer pulls onnxruntime in itself.
  "gliner[onnx]==0.2.29",
  # gliner's own dependencies that decide what the model sees, pinned for the
  # same reason (see requirements.txt, the pin of record).
  "transformers==5.16.1",
  "tokenizers==0.23.2",
  "huggingface_hub==1.33.0",
  # ONNX runtime for fp32 CPU inference (much faster than fp32 PyTorch; we do
  # NOT INT8-quantize — that collapsed person-name recall, BFSF-269)
  "onnx>=1.23.1,<2.0.0",
  "onnxruntime>=1.18.0,<2.0.0",
  # Declared even though nothing here imports it directly: gliner requires it,
  # and leaving it implicit means the resolver picks the default PyPI build
  # (CUDA, ~2.5 GB of nvidia-* wheels) for a service that runs CPU-only.
  # Same version the Dockerfile pins; the index below supplies the +cpu build.
  "torch==2.14.1",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10",
]

# The CPU-only torch build lives on PyTorch's own index; PyPI carries only the
# CUDA one. This mirrors what the Dockerfile does today
# (`pip install torch --extra-index-url https://download.pytorch.org/whl/cpu`).
# Locking therefore needs egress to download.pytorch.org:443, which this
# repo's build/agent environment answers with 403 at CONNECT. Open that host
# and `uv lock` here completes; until then requirements.txt stays the pin of
# record for this service.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
