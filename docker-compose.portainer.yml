# ─────────────────────────────────────────────────────────────
# BeeFlow — Portainer Stack (GHCR images)
#
# Pulls pre-built images from ghcr.io/bee-flow. Use the companion
# .env.portainer.example file for configuration.
#
# Quickstart in Portainer:
#   1. Stacks → Add stack → paste this YAML.
#   2. In "Environment variables", upload .env.portainer (after copying
#      from .env.portainer.example and filling in secrets).
#   3. Generate the secrets first:
#        SESSION_SECRET        = openssl rand -hex 32
#        MASTER_ENCRYPTION_KEY = openssl rand -hex 32
#        SERVICES_API_KEY      = openssl rand -hex 32
#        DB_PASSWORD           = openssl rand -hex 16
#        RUSTFS_PASSWORD       = openssl rand -hex 16
#        BROWSER_WS_PATH       = openssl rand -hex 24
#   4. Deploy. First boot pulls models on guard-service (~2 min).
#
# After deploying:
#   Frontend  → http://<host>:${FRONTEND_PORT}
#   Backend   → http://127.0.0.1:${SERVER_PORT}   (loopback-only by default;
#                the frontend proxies /api, /auth, … for browsers — see the
#                SERVER_BIND_HOST note on the server service below)
#   Search    → http://127.0.0.1:${SERVER_PORT}/api/search
#                (self-hosted inside server pod, no separate container)
#
# ─────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL (with pgvector) ───────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: beeflow-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - beeflow

  # ── Redis (sessions + guard PII decision cache) ──────────────
  redis:
    image: redis:7-alpine
    container_name: beeflow-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - beeflow

  # ── RustFS (S3-compatible object storage) ────────────────────
  rustfs:
    image: rustfs/rustfs:latest
    container_name: beeflow-rustfs
    environment:
      RUSTFS_ROOT_USER: ${RUSTFS_USER}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_PASSWORD}
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    restart: unless-stopped
    networks:
      - beeflow

  # ── Guard-service (CPU PII detection via GLiNER) ─────────────
  # First boot downloads ~1 GB of models (~2 min); cached in
  # guard-models volume after that. Health endpoint at
  # http://beeflow-guard:8100/health.
  guard-service:
    image: ghcr.io/bee-flow/guard:latest
    container_name: beeflow-guard
    environment:
      GUARD_PII_ENABLED: "true"
      # Must match the model baked into the image (Dockerfile ARG); a mismatch
      # is ignored for inference (the baked ONNX wins) but poisons the Redis
      # cache fingerprint.
      GUARD_PII_MODEL: E3-JSI/gliner-multi-pii-domains-v1
      GUARD_LOG_LEVEL: INFO
      GUARD_REDIS_URL: redis://redis:6379/2
      SERVICES_API_KEY: ${SERVICES_API_KEY}
    volumes:
      - guard-models:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    # Match the resource tuning of the hosted deployment.
    # Compose only honors `deploy.resources` under Swarm mode; for plain
    # `docker compose up` these are advisory. Keep them as documentation
    # of the intended shape per pod.
    deploy:
      resources:
        reservations:
          cpus: '1.0'
          memory: 1536M
        limits:
          cpus: '3.0'
          # The fp32 ONNX graph runs ~2.5 GB RSS steady (BFSF-269 measured);
          # the previous 3072M limit sat under RSS + startup headroom and was
          # an OOM-kill waiting for a long document. Mirrors the 4Gi k8s limit.
          memory: 4096M
    networks:
      - beeflow

  # ── BeeFlow Server (API + in-server search service) ──────────
  server:
    image: ghcr.io/bee-flow/server:latest
    container_name: beeflow-server
    command: npm start
    # Loopback-only by default — see docker-compose.from-registry.yml for the
    # full rationale. On 0.0.0.0 the API answers on every interface of the
    # Portainer host, so /auth/* and /api/* are reachable without passing
    # through the agent-hub nginx and everything that layer enforces is
    # bypassed. The frontend reaches the API over the `beeflow` network
    # (SERVER_HOST: server) and proxies /api, /auth, … for the browser, so the
    # published port is not part of any normal request path.
    #
    # Set SERVER_BIND_HOST=0.0.0.0 in the stack environment only if you deploy
    # a separate reverse proxy or an inbound webhook that must hit the API port
    # itself.
    ports:
      - "${SERVER_BIND_HOST:-127.0.0.1}:${SERVER_PORT}:${SERVER_PORT}"
    environment:
      NODE_ENV: production
      SERVER_PORT: ${SERVER_PORT}
      PORT: ${SERVER_PORT}

      # Public URLs (used for cookies + email links + OAuth callbacks)
      SERVER_PROTOCOL: ${SERVER_PROTOCOL}
      SERVER_PUBLIC_HOST: ${SERVER_PUBLIC_HOST}
      CLIENT_PROTOCOL: ${CLIENT_PROTOCOL}
      # Published in /.well-known/security.txt. Empty is valid: the route derives
      # security@<CLIENT_PUBLIC_HOST domain> when that host has a routable mail
      # domain, and 404s rather than guessing when it does not.
      SECURITY_TXT_CONTACT: ${SECURITY_TXT_CONTACT:-}
      CLIENT_PUBLIC_HOST: ${CLIENT_PUBLIC_HOST}
      # Security keys (YubiKey / FIDO2): optional parent domain for the WebAuthn
      # relying-party ID. Empty = the page's host, or CLIENT_PUBLIC_HOST when the
      # page is on a subdomain of it. See auth/securityKeys/relyingParty.js.
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      CORS_ORIGIN: ${CORS_ORIGIN}

      # Cookies
      COOKIE_NAME: ${COOKIE_NAME}
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE}

      # Features
      DEMO_MODE_ENABLED: ${DEMO_MODE_ENABLED}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE}
      ALLOW_SIGNUPS: ${ALLOW_SIGNUPS}
      ALLOW_PASSWORD_LOGIN: ${ALLOW_PASSWORD_LOGIN}
      ENABLE_TASKS: ${ENABLE_TASKS}
      ENABLE_MONITORING: ${ENABLE_MONITORING}

      # Databases (one PG instance, multiple logical DBs)
      CORE_DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/beeflow_tasks
      MONITORING_DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/monitoring_db

      # Secrets
      SESSION_SECRET: ${SESSION_SECRET}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      SERVICES_API_KEY: ${SERVICES_API_KEY}

      # In-cluster services
      REDIS_URL: redis://redis:6379/0
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_USER}
      RUSTFS_SECRET_KEY: ${RUSTFS_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}

      # Guard PII detection (internal container DNS)
      GUARD_SERVICE_URL: http://guard-service:8100
      PII_SERVICE_URL: http://guard-service:8100

      # Search service is self-hosted INSIDE this server pod at /api/search.
      # The agent_search tool POSTs here; no separate container needed.
      # Set SERPER_API_KEY below if you want web search via Serper.dev.
      SEARCH_SERVICE_URL: http://localhost:${SERVER_PORT}/api/search
      SERPER_API_KEY: ${SERPER_API_KEY}

      # GPU-only services intentionally left empty
      WHISPERX_URL: ""
      RERANKER_URL: ""

      # Shared headless browser: the `browser` sidecar below (PDF export,
      # thumbnails, SPA ingestion, browse_web). Set BROWSER_WS_PATH in the stack
      # environment (openssl rand -hex 24).
      BROWSER_WS_ENDPOINT: ws://browser:9222/${BROWSER_WS_PATH:-beeflow-browser}
    volumes:
      - beeflow-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rustfs:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${SERVER_PORT}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - beeflow
      - beeflow-browser

  # ── Shared headless browser (PDF export, thumbnails, SPA ingestion, browse_web)
  # The server image carries no Chromium. This sidecar is the Playwright server
  # it drives over BROWSER_WS_ENDPOINT, so none of that needs the Docker socket.
  # Playwright's launchServer has no authentication, so the sidecar sits on its
  # OWN network shared only with the server (never beeflow-network, where the
  # database, object storage and the guard live), publishes no port, and serves
  # at the path in BROWSER_WS_PATH (selfhost.sh generates a random one; set your
  # own when you deploy this file by hand). The network is not `internal`:
  # browse_web and SPA ingestion load public pages. The runner's Playwright must
  # match the server's (scripts/check-playwright-lockstep.mjs).
  browser:
    image: ghcr.io/bee-flow/pwt-runner:latest
    container_name: beeflow-browser
    command: serve
    environment:
      PWT_SERVE_HOST: 0.0.0.0
      PWT_SERVE_PORT: 9222
      PWT_SERVE_WS_PATH: ${BROWSER_WS_PATH:-beeflow-browser}
    shm_size: 256m
    mem_limit: ${BROWSER_MEMORY_LIMIT:-1g}
    pids_limit: 512
    init: true
    security_opt: [ "no-new-privileges:true" ]
    networks:
      - beeflow-browser
    restart: unless-stopped

  # ── Agent Hub (React frontend, served by nginx) ──────────────
  agent-hub:
    image: ghcr.io/bee-flow/agent-hub:latest
    container_name: beeflow-agent-hub
    ports:
      - "${FRONTEND_PORT}:80"
    environment:
      SERVER_HOST: server
      SERVER_PORT: ${SERVER_PORT}
      # Content-Security-Policy source for the analytics tracker script —
      # required for ANY external analytics origin, https included (script-src
      # no longer carries a blanket `https:`). Empty by default.
      # e.g. ANALYTICS_ORIGIN=https://stats.example.com
      ANALYTICS_ORIGIN: ${ANALYTICS_ORIGIN:-}
      # Every variable the nginx template uses must be listed: the stock
      # entrypoint substitutes only the ones named here, and an unsubstituted
      # ${VAR} stops nginx from starting. Kept as documentation and for older
      # images — the image now derives this list from the template itself, so a
      # stack file that predates a new variable no longer crash-loops.
      NGINX_ENVSUBST_FILTER: SERVER_HOST|SERVER_PORT|ANALYTICS_ORIGIN|NGINX_RESOLVER
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - beeflow

volumes:
  postgres-data:
  beeflow-data:
  rustfs-data:
  rustfs-logs:
  guard-models:

networks:
  beeflow:
    driver: bridge
  # Only the server and the browser sidecar. See the `browser` service.
  beeflow-browser:
    driver: bridge
