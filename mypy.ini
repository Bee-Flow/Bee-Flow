# mypy for the two Python sidecars' own code (app/). Run per service, from inside it:
#   cd guard-service    && mypy --config-file ../mypy.ini app
#   cd classify-service && mypy --config-file ../mypy.ini app
# CI: the python-lint job installs the service's requirements-dev.txt first, so
# fastapi, starlette and pydantic are typed; torch, gliner, transformers, redis and
# onnxruntime are NOT installed there (the job stays light) and are untyped on
# purpose: that is what the per-module ignore_missing_imports below is for.
#
# The gate is the default (non-strict) mode at 0 errors, on app/ only. Tests, eval
# and tools are not checked. Tighten with `disallow_untyped_defs` and friends once
# the files you touch are clean; ruff's ANN rules already require annotations.
[mypy]
python_version = 3.12
plugins = pydantic.mypy
warn_unused_configs = False
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
check_untyped_defs = True
pretty = False

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True

# Model stack and cache client: not installed in the lint job.
[mypy-torch.*,gliner.*,gliclass.*,transformers.*,onnxruntime.*,redis.*]
ignore_missing_imports = True
