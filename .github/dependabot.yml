# Dependabot — ISO/IEC 27001 A.8.8, management of technical vulnerabilities.
#
# WHY THIS FILE EXISTS AT ALL, AND WHY ITS ABSENCE WAS A FINDING
# Bee Flow ships an A.8.8 control (server/compliance/checks/iso27001/
# a8-8-vuln-mgmt.js) that reads a CUSTOMER's Dependabot alerts and FAILS their
# ISO readiness when a critical or high alert has been open past 30 days. This
# repository had no Dependabot configuration, no dependency audit in CI and no
# image scanning. Asking customers for a control the product does not run on
# itself is the kind of thing a certified customer's supplier assessment
# (A.5.19–A.5.22) is designed to find, and it would be right to find it.
#
# WHAT DEPENDABOT DOES AND DOES NOT DO HERE
# It raises pull requests. It does not gate anything — the gate is
# .github/workflows/dependency-audit.yml, which ratchets so the count cannot
# grow. The two are meant to be read together: the ratchet stops the debt
# increasing, Dependabot is what actually pays it down.
#
# TWO KINDS OF UPDATE. Dependabot raises two different PRs and this file
# paces only one of them.
#   - Security updates: opened when an advisory is published for a version in
#     a lockfile, whatever the schedule says. They are switched on by the
#     repository setting "Dependabot security updates", not here (`gh api -X
#     PUT repos/{owner}/{repo}/automated-security-fixes`; a GET says whether
#     it is on). No advisory feed covers a base image or an action pinned to a
#     commit, so those two never get one (see their entries).
#     `schedule`, `groups` and `open-pull-requests-limit`
#     do not touch them (GitHub caps them at 10 open, separately). This file
#     can still silence them: an `ignore` by name alone, or by `versions`,
#     applies to security updates too (those entries say so). An `ignore` by
#     `update-types` only applies to version updates.
#   - Version updates: "a newer release exists". Everything below paces these.
#
# CADENCE: monthly, every entry, on the 1st at 05:00. A version bump that
# fixes nothing is maintenance, and it is cheaper done once a month in one
# reviewed PR per ecosystem than in ten PRs a week, each a CI run, that
# nobody reads. Speed is where it matters, for vulnerabilities, and two
# things cover that without a schedule: the security updates above, and
# .github/workflows/vuln-watch.yml, which scans every lockfile and runtime
# hourly (OSV-Scanner plus scripts/runtime-watch.mjs) and raises a
# code-scanning alert for a HIGH or CRITICAL the hour its advisory appears
# (rules: scripts/vuln-watch-gate.mjs). That is also why guard-service and
# classify-service, which read customer text, no longer need weekly version
# bumps: what made the weekly cadence matter for them was a vulnerable
# dependency, and that now reaches them within the hour, not within the week.
# `day` only means something to a weekly schedule, so no entry sets it.
#
# GROUPING: one group per entry with every minor and patch in it, so one PR
# per ecosystem/directory per month. Ungrouped, this repository's manifests
# would open dozens of PRs a month, which ends with everyone ignoring them —
# an alert nobody reads is worse than no alert, because it looks like
# coverage. `open-pull-requests-limit: 2` on every entry: the group is the one
# version-update PR an entry opens; the second slot is headroom, not a quota.
#
# MAJORS: every entry ignores `version-update:semver-major` for "*". A major
# is planned work (a migration, a peer range, a runtime), done by hand in its
# own PR, not something a bot drops in the queue. Because the rule is by
# `update-types`, it does not stop a security update: a fix that only exists
# in a new major still opens as a security-update PR (and vuln-watch reports
# it). The specific ignores further down stay, with their reasons: they say
# what has to be true before that major (or minor) can be planned.
#
# REBASING: `rebase-strategy: disabled` on every entry. By default Dependabot
# rebases each open PR that a push to main puts in conflict, and every rebase
# re-runs CI on a PR nobody was about to merge — after one merge that touched
# a lockfile, a dozen of them at once. An open PR now stays as it is
# until someone means to merge it: comment `@dependabot rebase` on the PR,
# wait for its checks, then merge. Security-update PRs still open as usual;
# the setting applies to them too, so the same comment brings one up to date.
version: 2

updates:
  # ── Node ──────────────────────────────────────────────────────────
  # Ordered by blast radius: server and agent-hub ship to customers, the rest
  # are tooling or satellites.
  - package-ecosystem: npm
    directory: /server
    schedule: { interval: monthly, time: "05:00", timezone: Europe/Amsterdam }
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      server-patch-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    # playwright moves by hand, in the same change as the base image of
    # server/pwt-runner/Dockerfile: the server's chromium.connect() to the
    # shared browser is refused (HTTP 428) when the two differ. A bump on this
    # side alone would ship a server that cannot export a PDF. The server and
    # pwt-runner build jobs in build-push-ghcr.yml both run
    # scripts/check-playwright-lockstep.mjs and fail when the two disagree.
    ignore:
      # Every major waits for a deliberate move (header, MAJORS).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # @mistralai/mistralai declares @opentelemetry/resources ^2 as a peer, so the
      # OpenTelemetry 3 line (core/resources/sdk-metrics 3, sdk-node 0.300, api 1.10)
      # waits until the Mistral SDK admits it.
      - dependency-name: "@opentelemetry/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@opentelemetry/sdk-node"
        versions: [">=0.300.0"]
      - dependency-name: "@opentelemetry/exporter-*"
        versions: [">=0.300.0"]
      - dependency-name: "@opentelemetry/auto-instrumentations-node"
        versions: [">=0.82.0"]
      - dependency-name: "@opentelemetry/api"
        versions: [">=1.10.0"]
      - dependency-name: playwright
      # The runtime is Node 22 (.nvmrc, engines, node:22 images); the types
      # follow the runtime major, not the newest Node (#33).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # isolated-vm 7 needs Node >= 24 (engines) and ships no prebuild for
      # Node 22's ABI (#150). 6.2.0 carries 7.0.1's ExternalCopy fix. Lift with
      # the move to Node 24, together with a code-sandbox test run.
      - dependency-name: isolated-vm
        update-types: ["version-update:semver-major"]
    labels: [dependencies, security]

  - package-ecosystem: npm
    directory: /agent-hub
    schedule: { interval: monthly, time: "05:00", timezone: Europe/Amsterdam }
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      frontend-patch-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    # Each entry below held back an update that broke CI or the product when
    # main moved to ci.yml (2026-09-23, PRs #210, #211, #213). Lift an entry in
    # the PR that makes its condition true, never on its own. `ignore` also
    # silences security-update PRs for these names: act on an alert by hand.
    ignore:
      # Every major waits for a deliberate move (header, MAJORS).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # mermaid 12 adds about 280 kB to the bundle (bundle ratchet). Take it in a PR
      # that lazy-loads the diagram renderer.
      - dependency-name: mermaid
        update-types: ["version-update:semver-major"]
      # 7.1 reports every React Compiler finding per function (react#35873-35884):
      # 2 errors and +508 warnings over the agent-hub baseline. Lift in
      # the PR that fixes those findings or re-baselines eslint-suppressions.json with a reason.
      - dependency-name: eslint-plugin-react-hooks
        versions: [">=7.1.0"]
      # 0.5 rewrote HOC detection ("major-like", its changelog): +67
      # only-export-components warnings. Lift together with react-hooks above.
      - dependency-name: eslint-plugin-react-refresh
        versions: [">=0.5.0"]
      # 0.18 prefixes KaTeX's CSS classes (KaTeX#4229) while rehype-katex 7.0.1,
      # mermaid and micromark-extension-math still render with katex ^0.16, so
      # chat math would get 0.16 HTML under 0.18 CSS. No test sees it (jsdom has
      # no layout). Lift when rehype-katex accepts 0.18.
      - dependency-name: katex
        versions: [">=0.17.0"]
      # ESLint 10: eslint-plugin-import 2.32.0 (peer eslint ^9; the fix #3230 is
      # merged but unreleased) and eslint-plugin-react 7.37.5 (peer ^9.7; #4022
      # open) neither install next to it nor run under it. Lift when both
      # publish an ^10 peer range (or after a swap to eslint-plugin-import-x and
      # dropping eslint-plugin-react) AND react-hooks >= 7.1 is on main (7.0.1
      # stops at ^9), in a hand-made PR that also fixes eslint 10's new
      # recommended errors.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # @eslint/js 10 has peer eslint ^10, so it can only move with eslint.
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # `npm run typecheck` runs TypeScript 7 through the typescript-7 alias.
      # TypeScript 7.0 ships no JavaScript API (require('typescript') is only
      # { version }); typescript-eslint 8.x needs it (peer <6.1.0) and crashes
      # while eslint.config.js loads. Lift when `npm view typescript-eslint@latest
      # peerDependencies.typescript` admits 7.x (typescript-eslint#10940; the API
      # is expected in TS 7.1), bumping both in one PR.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    labels: [dependencies, security]

  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly, time: "05:00", timezone: Europe/Amsterdam }
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      root-patch-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Every major waits for a deliberate move (header, MAJORS).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Node 22 runtime (.nvmrc): @types/node follows the runtime major (see /server).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /mobile
    schedule: { interval: monthly, time: "05:00", timezone: Europe/Amsterdam }
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      mobile-patch-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    # Expo SDK 57 pins these in expo/bundledNativeModules.json. They move WITH
    # the SDK (`npx expo install --fix` after an expo bump), never on their own.
    # Dependabot counts a 0.x minor (react-native 0.86 -> 0.87, worklets
    # 0.10 -> 0.13) and React 19.2 -> 19.3 as "minor", so mobile-patch-minor
    # pulled them out of the SDK contract in #230, and its --force lockfile
    # broke `npm ci`. Exact pins: no updates at all. Tilde pins: patches only.
    # mobile/src/lib/nativeDeps.test.ts fails an expo bump whose SDK map has
    # moved one of these, which is the cue to run `npx expo install --fix`.
    # An expo bump can also leave an expo-* module's DECLARED range under the
    # new SDK floor while npm already installed the right version (#244);
    # `--fix` does not see that. Copy the ranges the test prints into
    # package.json and the root entry of package-lock.json.
    # This also silences security-update PRs for these names: act on an alert
    # by moving expo to the patched SDK release. Revisit the list at each SDK
    # upgrade (SDK 58 = RN 0.88, React 19.3, reanimated 4.6, worklets 0.12).
    ignore:
      # Every major waits for a deliberate move (header, MAJORS).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-test-renderer
      - dependency-name: react-native
      - dependency-name: react-native-reanimated
      - dependency-name: react-native-worklets
      - dependency-name: react-native-svg
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "@react-native-community/netinfo"
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: react-native-screens
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: react-native-safe-area-context
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: react-native-gesture-handler
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: react-native-webview
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # ESLint 10 (#245): eslint-config-expo 57.0.2 (58.0.2 too) ships
      # eslint-plugin-react 7.37.5 and eslint-plugin-import 2.32.0, peers ^9 at
      # most; under 10 react/* crash on context.getFilename and import/order on
      # sourceCode.getTokenOrCommentAfter, and the PR's lockfile nests
      # eslint-import-resolver-typescript so the `@/` alias stops resolving.
      # @eslint/compat's fixupConfigRules can shim the plugins today; we wait
      # for real support instead. Lift when eslint-config-expo depends on
      # releases with an eslint ^10 peer.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (#246) ships no JavaScript API: typescript-eslint 8.x (peer
      # <6.1.0) and ts-api-utils crash on it. mobile is on ~5.9, so this also
      # holds back 6.0.x ON PURPOSE: Expo SDK 57 recommends ~6.0.3, and that
      # move is done by hand together with "types": ["jest", "node"] in
      # mobile/tsconfig.json (without it tsc reports ~2000 errors). Narrow this
      # to versions [">=6.1.0"] after that move; lift it when typescript-eslint
      # and the Expo SDK both admit 7.x.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Expo SDK majors move together in the SDK upgrade, never one by one
      # (#29, #30: SDK 58 modules from npm's `next` tag need compileSdk 37).
      # expo-share-intent is third-party, but its majors also follow the SDK
      # (7 = expo ^56, 8 = expo ^57). With the major ignored, each module's
      # newest allowed version is its SDK patch, so mobile-patch-minor picks it
      # up instead of leaving it behind (#26).
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/vector-icons"
        update-types: ["version-update:semver-major"]
    labels: [dependencies]

  # The desktop client runs on the user's own machine (the audit ratchet counts
  # its runtime dependencies). Electron majors move by hand: a major changes the
  # Chromium and Node it embeds, and desktop/ is tested against one Electron
  # line (see the engines field and the desktop job in ci.yml). Patches and minors come
  # in one monthly PR.
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: monthly, time: "05:00", timezone: Europe/Amsterdam }
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      desktop-patch-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Every major waits for a deliberate move (header, MAJORS).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: electron
        update-types: ["version-update:semver-major"]
      # typecheck and build already run on TypeScript 7 (the typescript-7
      # alias); `typescript` itself stays on 6 for typescript-eslint 8.x (peer
      # <6.1.0, no TS 7 JS API before 7.1). Lift with agent-hub's entry.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node 22 runtime (.nvmrc): @types/node follows the runtime major (see /server).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint and @eslint/js follow agent-hub's eslint major (version-drift
      # ratchet); move them together with agent-hub.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /nextcloud-connector
    schedule: { interval: monthly, time: "05:00", timezone: Europe/Amsterdam }
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      connector-patch-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Every major waits for a deliberate move (header, MAJORS).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Node 22 runtime (.nvmrc): @types/node follows the runtime major (see /server).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels: [dependencies, security]

  - package-ecosystem: npm
    directory: /docs
    schedule: { interval: monthly, time: "05:00", timezone: Europe/Amsterdam }
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      docs-patch-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Every major waits for a deliberate move (header, MAJORS).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: [dependencies]

  # Satellites and tooling that had no entry: the module SDK, the e2e suite and
  # the components (/components itself is their lint and smoke-test tooling).
  # Monthly and grouped, one PR for all of them (a group spans
  # the directories of one entry). scripts/packages.json lists every package;
  # `npm run lint:package-registry` fails on a package without an entry here.
  - package-ecosystem: npm
    directories: ["/hub-module-sdk", "/hub-module-sdk/modules/security_scan", "/hub-module-sdk/modules/security_scan/frontend", "/e2e", "/components", "/components/*"]
    schedule: { interval: monthly, time: "05:00", timezone: Europe/Amsterdam }
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      satellites-patch-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Every major waits for a deliberate move (header, MAJORS).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Node 22 runtime (.nvmrc): @types/node follows the runtime major (see /server).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels: [dependencies]

  # The shared browser pod. Its playwright moves by hand with the server's and
  # the base image of server/pwt-runner/Dockerfile (see the /server entry), so
  # both names are ignored here, as there.
  - package-ecosystem: npm
    directory: /server/pwt-runner
    schedule: { interval: monthly, time: "05:00", timezone: Europe/Amsterdam }
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      pwt-runner-patch-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Every major waits for a deliberate move (header, MAJORS).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: playwright
      - dependency-name: "@playwright/test"
    labels: [dependencies]

  # ── Python sidecars ───────────────────────────────────────────────
  # guard-service handles personal data by definition — it is the PII
  # detector — so its dependencies carry the same weight as the server's, not
  # less because it is "just a sidecar". Its version updates are monthly like
  # everyone's; a vulnerable dependency reaches it through security updates and
  # vuln-watch within the hour (CADENCE, in the header).
  - package-ecosystem: pip
    directory: /guard-service
    schedule: { interval: monthly, time: "05:00", timezone: Europe/Amsterdam }
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      guard-service-patch-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Every major waits for a deliberate move (header, MAJORS).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # gliner 0.2.29 (pinned, newest) requires transformers<5.17.0 (#14). Lift
      # when a gliner release admits it; bump both together with a gate run.
      - dependency-name: transformers
        versions: [">=5.17.0"]
      # transformers 5.x and tokenizers 0.23 require huggingface-hub<2.0 (#15).
      - dependency-name: huggingface-hub
        update-types: ["version-update:semver-major"]
    labels: [dependencies, security]

  # classify-service reads customer text too (it scores it against labels),
  # so the same holds: monthly version updates, security through security
  # updates and vuln-watch (CADENCE, in the header).
  - package-ecosystem: pip
    directory: /classify-service
    schedule: { interval: monthly, time: "05:00", timezone: Europe/Amsterdam }
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      classify-service-patch-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Every major waits for a deliberate move (header, MAJORS).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # transformers 5.17 and tokenizers 0.23 require huggingface-hub<2.0 (#13).
      - dependency-name: huggingface-hub
        update-types: ["version-update:semver-major"]
    labels: [dependencies, security]

  # ── The supply chain of the build itself ──────────────────────────
  # A compromised action runs with the workflow's token. The secret-scan
  # workflow already pins gitleaks by sha256 for the same reason; this keeps the
  # actions themselves current.
  # Monthly. Every third-party action in .github/workflows is pinned to a
  # commit, and GitHub raises no Dependabot alert (so no security-update PR)
  # for an action pinned that way: this entry is the only thing that moves
  # them. actions/* are pinned the same way, with a `# vX.Y.Z` comment. A
  # major is ignored here as everywhere (MAJORS, in the header), and since no
  # security-update PR exists for a pinned action, an action major is only
  # ever moved by hand: GitHub announces the runtime deprecations that force
  # one (node20 -> node24) in the workflow run annotations months ahead.
  # This entry only scans .github/workflows. The connector's own workflows
  # (nextcloud-connector/.github/workflows, mirrored to Bee-Flow/connector) are
  # not scanned: bump their pins by hand to the versions used here.
  - package-ecosystem: github-actions
    # The composite action pins setup-node itself; Dependabot reads
    # .github/workflows from "/" and a local action only by its own directory.
    directories: ["/", "/.github/actions/npm-install"]
    schedule: { interval: monthly, time: "05:00", timezone: Europe/Amsterdam }
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      actions-patch-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Every major waits for a deliberate move (header, MAJORS).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # setup-gradle v6 makes the proprietary gradle-actions-caching component
      # (Gradle's own terms, not MIT) the default cache provider (#21). v5 is
      # node24 and MIT; take that.
      - dependency-name: "gradle/actions/setup-gradle"
        versions: [">= 6"]
    labels: [dependencies, security, ci]

  # ── Base images ───────────────────────────────────────────────────
  # Every FROM is pinned to a digest, so a base image only moves when one of
  # these PRs lands. One directory per Dockerfile location; a directory with
  # several Dockerfiles is one entry. guard-service/tools/candidate_shim builds FROM ghcr.io/bee-flow/guard:dev,
  # a moving tag of our own, and is deliberately not listed.
  - package-ecosystem: docker
    directories:
      - /server
      - /server/pwt-runner
      - /server/terminal-runner
      - /hub-module-sdk/modules/security_scan/assets/terminal-runner
      - /agent-hub
      - /nextcloud-connector
      - /guard-service
      - /classify-service
    # No advisory feed covers a base image, so it
    # never gets a security-update PR and this entry is the only thing that
    # moves one. When image-scan.yml reports a HIGH or CRITICAL that a newer
    # base fixes, do not wait for the 1st: Insights → Dependency graph →
    # Dependabot → "Check for updates" on the Dockerfile, or move the digest
    # by hand.
    schedule: { interval: monthly, time: "05:00", timezone: Europe/Amsterdam }
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    # Digest refreshes and patch tags only, stricter than the header's rule
    # for the other ecosystems (which also take minors). A base-image major or minor is a runtime change, not a
    # refresh: node 22 → 24 against an .nvmrc that CI tests on 22, python
    # 3.12 → 3.13 under wheels built for 3.12, CUDA 12.4 → 12.6 under torch.
    # Those are made by hand, one image at a time, never bundled into the
    # monthly group with fifteen digest bumps.
    # The Playwright image does not move by version at all here: its tag must
    # equal server/package.json's playwright (see the /server entry above).
    # `*playwright` because the dependency name may or may not carry the
    # mcr.microsoft.com prefix.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "*playwright"
        update-types: ["version-update:semver-patch"]
    groups:
      base-images:
        patterns: ["*"]
    labels: [dependencies, security]
