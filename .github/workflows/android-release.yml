# Build the Bee Flow Android APK.
#
#   pull request touching mobile/**   → dev APK, uploaded as a build artifact
#                                       (a fork's PR: built, never uploaded)
#   push to main (mobile/** changed)  → dev APK, uploaded as a build artifact
#   manual run, channel=dev           → same, on demand, any branch
#   manual run, channel=prod (main)   → signed APK + AAB + a GitHub Release
#
# WHY THE PR TRIGGER IS CONDITIONAL (the superseded reason is kept on purpose).
#
# It used to be unconditional, and the reason was a bootstrap one: GitHub only
# registers a workflow — and only offers its "Run workflow" button — once the
# file exists on the DEFAULT branch, so while this file lived only on its own
# branch there was no way to dispatch it, and a PR build was the only way to
# get an installable APK out of a branch. That reason expired the moment this
# merged. The file is on main, and workflow_dispatch against a non-main branch
# has been used successfully (two runs on claude/android-apk-github-workflows-
# buk93b, 2026-08-31, 16.0 and 28.4 min). The reason is written down rather
# than deleted because the WANT it served did not expire — putting the thing on
# a phone before deciding whether to merge is still the point — it just has two
# cheaper routes now: the `android-apk` label, and manual dispatch on a branch.
#
# So the PR trigger stays, but the ~15-minute Gradle build behind it runs only
# when the `guard` job below decides one of these is true:
#   1. the PR touches something that can break the NATIVE build: dependencies,
#      Expo config, the config plugin, the local native module, the JS bundler
#      config, the launcher assets, the Node version, or this workflow.
#      the mobile job in ci.yml already covers everything short of the compile itself
#      (lint, typecheck, unit tests, `expo prebuild`), so a pure JS/UI PR gains
#      nothing from Gradle — and on all three android-release failures ever
#      recorded (the 2026-09-17 dependabot PRs) mobile-checks failed first.
#   2. the PR carries the `android-apk` label — the one-click "build me
#      something I can side-load", available on any mobile PR, no YAML edit.
# Everything that is not a pull_request (push to main, workflow_dispatch)
# always builds; main is the real regression gate and is untouched.
#
# Measured before narrowing: pull_request runs cost 188.9 runner-minutes over
# 15 steady-state days (median run 15.4 min; the 43m57s figure quoted elsewhere
# is a 2026-08-29 pre-cache run that was killed by the then-45-minute cap, not
# current cost). This workflow is NOT a required check — repo ruleset 23605458
# requires exactly `scan` and `audit` — and it runs beside mobile-checks, so it
# gates nothing. The saving is runner minutes only, ~$3/month. Do not
# "simplify" this back to an unconditional build without re-reading the above.
#
# Why the APK is a first-class output and not just a Play Store upload: Bee
# Flow is a self-hosted, privacy-first product. A meaningful share of its users
# install from a direct download onto a device that may not have Google Play
# Services at all — the app ships without Firebase for exactly that reason (see
# mobile/app.config.ts). So every run produces an installable APK; the AAB is
# built alongside it for the operators who do want the Play Store.
#
# The native android/ directory is NOT in the repository. `expo prebuild`
# generates it from mobile/app.config.ts and mobile/plugins/withBeeFlowAndroid.js
# on every run, which is what keeps the manifest single-sourced. If you find
# yourself wanting to edit a generated file, edit the plugin instead.
name: Android APK

on:
  pull_request:
    # `labeled` is here so that adding `android-apk` to an existing PR starts a
    # build. The paths filter below stays COARSE on purpose: GitHub applies path
    # filters to every activity type, so narrowing it here would make the label
    # unreachable on precisely the JS-only PRs it exists for. The narrowing
    # happens in `guard`, where a skipped decision costs seconds, not minutes.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-release.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: 'dev (artifact only) or prod (signed + GitHub Release, main only)'
        type: choice
        options: [dev, prod]
        default: dev
        required: true
      version:
        description: 'Release tag for prod (e.g. android-v1.0.0). Blank auto-names android-YYYY.MM.DD-<run>.'
        default: ''
        required: false
      server_url:
        description: 'Default server URL baked into the build. Blank makes first run ASK, which is the right default for self-hosters.'
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  # Prod builds serialise; dev builds are keyed on the run so parallel branches
  # do not cancel each other.
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'prod' && 'android-prod' || format('android-{0}', github.ref) }}
  # Dev builds supersede: a 40-minute build for a commit that has already been
  # replaced is 40 minutes of runner time spent on an answer nobody wants.
  # Keyed on the ref rather than the run id, which never collided and so never
  # cancelled anything. Prod is its own group and still never cancels.
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.channel == 'prod') }}

env:
  # versionCode must increase monotonically for every build Android ever sees.
  # The run number is the only monotonic thing CI has; it is never reset.
  BEEFLOW_VERSION_CODE: ${{ github.run_number }}
  BEEFLOW_COMMIT_SHA: ${{ github.sha }}
  EXPO_NO_TELEMETRY: '1'

jobs:
  guard:
    # A prod build off a feature branch would produce a signed, release-tagged
    # APK from unreviewed code. Refuse early and say why.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only to read the PR's changed-file list below. No checkout needed.
      pull-requests: read
    outputs:
      build_apk: ${{ steps.decide.outputs.build_apk }}
    steps:
      - name: Production builds only from main
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'prod' && github.ref != 'refs/heads/main' }}
        # A branch name can hold `$(…)`: the ref reaches the shell as a
        # variable, never spliced into the script text.
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::channel=prod is only allowed from main (got ${REF})."
          exit 1

      # Decide whether this event is worth ~15 minutes of Gradle. The pattern
      # list is fenced by the two sentinel comments because
      # mobile/src/lib/androidCiTrigger.test.ts parses it: edit the list, never
      # the sentinels, and add a pattern whenever locally-authored native code
      # or build config moves. The test fails if you forget.
      - id: decide
        name: Decide whether to build the APK
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          LABELLED: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'android-apk') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "build_apk=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$EVENT always builds."
            exit 0
          fi
          if [[ "$LABELLED" == "true" ]]; then
            echo "build_apk=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PR carries the android-apk label — building an installable APK."
            exit 0
          fi
          cat > "$RUNNER_TEMP/native-paths.txt" <<'EOF'
          # NATIVE_PATHS_BEGIN
          ^mobile/package\.json$
          ^mobile/package-lock\.json$
          ^mobile/app\.config\.ts$
          ^mobile/plugins/
          ^mobile/modules/
          ^mobile/metro\.config\.js$
          ^mobile/babel\.config\.js$
          ^mobile/assets/
          ^\.nvmrc$
          ^\.github/workflows/android-release\.yml$
          # NATIVE_PATHS_END
          EOF
          if ! CHANGED="$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')"; then
            echo "build_apk=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not list the PR's changed files. Failing OPEN and building: a skipped native check is worse than a spent runner minute."
            exit 0
          fi
          if printf '%s\n' "$CHANGED" | grep -E -f "$RUNNER_TEMP/native-paths.txt" > "$RUNNER_TEMP/native-hits.txt"; then
            echo "build_apk=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Native-affecting files changed: $(paste -sd' ' "$RUNNER_TEMP/native-hits.txt")"
          else
            echo "build_apk=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No native-affecting file changed; the mobile job in ci.yml covers this PR (lint, typecheck, unit tests, expo prebuild). For an installable APK add the 'android-apk' label, or run this workflow manually on the branch."
          fi

  build:
    needs: guard
    # Skipped for PRs that only touch JS/UI — see the header. Not a required
    # check, so a skipped job blocks nothing.
    if: ${{ needs.guard.outputs.build_apk == 'true' }}
    runs-on: ubuntu-latest
    # Measured, not guessed: the first build that got past the C++ errors ran
    # 43m57s of pure Gradle and was killed by a 45-minute cap. A cold React
    # Native build compiles six C++ modules through CMake, and until a cache
    # exists anywhere in the repo every run pays that in full. 90 gives a cold
    # build room to finish and still catches a genuine hang.
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.meta.outputs.version_name }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # React Native 0.86's Gradle plugin and AGP 8.x both require JDK 17.
      # Temurin because it is what the Android toolchain is tested against.
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      # Pinned to a commit, like softprops/action-gh-release below. These two
      # "only set up a toolchain", but they run in the job that holds the
      # upload keystore on a prod build, and a tag can be moved upstream (it
      # happened to trivy-action's). Dependabot's github-actions entry keeps
      # the pins current, so the floating major bought nothing a PR does not.
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - id: meta
        name: Resolve build metadata
        working-directory: mobile
        env:
          INPUT_VERSION: ${{ inputs.version }}
          CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'dev' }}
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$CHANNEL" == "prod" ]]; then
            TAG="$(echo "${INPUT_VERSION:-}" | tr -d '[:space:]')"
            [[ -n "$TAG" ]] || TAG="android-$(date -u +%Y.%m.%d)-${{ github.run_number }}"
          else
            TAG="dev-${GITHUB_SHA::7}"
          fi
          {
            echo "channel=$CHANNEL"
            echo "tag=$TAG"
            echo "version_name=$APP_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Building Bee Flow $APP_VERSION (versionCode ${{ github.run_number }}), channel=$CHANNEL, tag=$TAG"

      # Signing is OPTIONAL on purpose. A build without the upload key (a fork's
      # PR never sees repository secrets) still produces an installable APK —
      # it is just signed with the debug key, and the artifact name says so.
      # That is worth far more than a build that fails for contributors. (A
      # fork's APK is built but not uploaded; see `Upload artifacts`.)
      #
      # And the upload key is staged for a PROD run only. A pull request or a
      # channel=dev dispatch builds whatever code the branch holds, unreviewed;
      # signing that with the key the Play Store trusts would make any branch a
      # route to a "release-signed" APK. Those builds stay debug-signed even
      # once the ANDROID_* secrets exist. Prod is main only: `guard` refuses it
      # anywhere else, and the ref is checked here again so the key never
      # depends on how another job's failure skips this one.
      - id: signing
        name: Stage the upload keystore
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'prod' && github.ref == 'refs/heads/main' }}
        working-directory: mobile
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_B64:-}" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret — building a debug-signed APK. Not for distribution."
            exit 0
          fi
          for var in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!var:-}" ]]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is set but ANDROID_${var} is missing."
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/upload.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Release signing key staged."

      # Generates android/ from app.config.ts + plugins/. --no-install because
      # node_modules is already installed and prebuild's own install would
      # resolve a different tree than `npm ci` just pinned.
      - name: Generate the native project
        working-directory: mobile
        env:
          BEEFLOW_BUILD_PROFILE: ${{ steps.meta.outputs.channel }}
          BEEFLOW_DEFAULT_SERVER_URL: ${{ inputs.server_url }}
        run: npx expo prebuild --platform android --no-install

      # Written AFTER prebuild: prebuild rewrites gradle.properties, so these
      # would be lost if they went in first. The values are read by the
      # signingConfig that plugins/withBeeFlowAndroid.js injects.
      - name: Point Gradle at the keystore
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'prod' && github.ref == 'refs/heads/main' && steps.signing.outputs.signed == 'true' }}
        working-directory: mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          {
            echo ""
            echo "BEEFLOW_UPLOAD_STORE_FILE=$RUNNER_TEMP/signing/upload.jks"
            echo "BEEFLOW_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BEEFLOW_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "BEEFLOW_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # NOT read-only on branches. The default (write only from the default
          # branch) assumes the default branch builds often; this workflow is
          # new, main has never built Android, and so no cache existed anywhere
          # and every PR run compiled the NDK from scratch. Letting a branch
          # write its own cache is what makes the SECOND run on a branch fast.
          cache-read-only: false
          gradle-home-cache-cleanup: true

      # Dev builds target arm64-v8a only. The NDK work is per-ABI, so building
      # all four quadruples the slowest part of the build to produce three
      # binaries nobody installs: every Android phone shipped since roughly
      # 2019 is arm64-v8a, and a dev APK exists to be side-loaded onto a real
      # device. Prod still builds all four, because a Play Store artifact has
      # to serve the devices that are not.
      - name: Build APK
        working-directory: mobile/android
        env:
          CHANNEL: ${{ steps.meta.outputs.channel }}
          # expo-constants' createExpoConfig task warns "NODE_ENV is required
          # but was not specified" and falls back to reading only .env.local and
          # .env. That fallback is the problem: which env files Expo loads, and
          # how it resolves the app config, both depend on this. A release APK
          # must be built as production.
          #
          # Scoped to this step, NOT the job. As a job-level env it would also
          # reach `npm ci`, which omits devDependencies under NODE_ENV=production
          # — a much worse bug, and a silent one.
          NODE_ENV: production
        run: |
          set -euo pipefail
          ARCHS='armeabi-v7a,arm64-v8a,x86,x86_64'
          [[ "$CHANNEL" == "prod" ]] || ARCHS='arm64-v8a'
          echo "::notice::Building for $ARCHS"
          ./gradlew --no-daemon assembleRelease \
            -PreactNativeArchitectures="$ARCHS" \
            --build-cache

      - name: Build AAB
        if: steps.meta.outputs.channel == 'prod'
        working-directory: mobile/android
        env:
          NODE_ENV: production
        run: ./gradlew --no-daemon bundleRelease --build-cache

      - name: Name the outputs
        id: outputs
        working-directory: mobile
        env:
          CHANNEL: ${{ steps.meta.outputs.channel }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          # Read from mobile/package.json, i.e. whatever the branch says: a
          # variable in the shell, never spliced into the script text.
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          if [[ -z "$APK" ]]; then
            echo "::error::Gradle reported success but produced no APK."
            exit 1
          fi
          SUFFIX=""
          [[ "$SIGNED" == "true" ]] || SUFFIX="-unsigned"
          NAME="beeflow-${CHANNEL}-${VERSION_NAME}-${{ github.run_number }}${SUFFIX}"
          mkdir -p dist
          cp "$APK" "dist/${NAME}.apk"
          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' 2>/dev/null | head -1 || true)"
          [[ -n "$AAB" ]] && cp "$AAB" "dist/${NAME}.aab"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      # Never for a pull request from a fork (a deleted fork counts as one).
      # Its APK would be an official-looking download hosted on this
      # repository, built from code nobody here has merged. The build above
      # still runs, so the PR keeps its native-build verdict.
      - name: Upload artifacts
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.outputs.outputs.name }}
          path: mobile/dist/*
          # Long enough to be useful for a dev build, short enough not to
          # accumulate hundreds of 60 MB binaries.
          retention-days: ${{ steps.meta.outputs.channel == 'prod' && 90 || 14 }}
          if-no-files-found: error

  release:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'prod' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V="$(echo "${INPUT_VERSION:-}" | tr -d '[:space:]')"
          if [[ -z "$V" ]]; then V="android-$(date -u +%Y.%m.%d)-${{ github.run_number }}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: beeflow-prod-*
          path: dist
          merge-multiple: true

      - name: Refuse to release an unsigned build
        if: needs.build.outputs.signed != 'true'
        run: |
          echo "::error::The build was not signed with the upload key, so it cannot be published."
          echo "Set the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and"
          echo "ANDROID_KEY_PASSWORD repository secrets, then run again."
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Bee Flow for Android ${{ needs.build.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
          body: |
            Bee Flow for Android — version ${{ needs.build.outputs.version_name }},
            versionCode ${{ github.run_number }}, built from `${{ github.sha }}`.

            **Install the APK directly.** Bee Flow is self-hosted and
            privacy-first; the app ships without Firebase and works on a device
            with no Google Play Services. Download the `.apk` below and allow
            installation from your browser or file manager when Android asks.

            The `.aab` is for publishing to the Play Store and cannot be
            installed directly.

            On first launch the app asks which Bee Flow server to connect to.
            Enter your own host — for example `https://ai.example.com` — and it
            will check `/api/health` before remembering it.
