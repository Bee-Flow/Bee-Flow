# Static analysis (SAST) on every pull request. The code-quality programme's
# validation batches found 7 and then 29 security bugs by hand; nothing in CI
# looked for that class of bug before.
#
# Semgrep's open-source engine with the registry's rulesets for the languages
# this repo ships (JS/TS, Python, Dockerfiles, GitHub Actions). CodeQL would
# need GitHub Advanced Security to upload results for a private repository;
# Semgrep needs no account and reports in the log.
#
# The gate is NEW findings only: `--baseline-commit` makes Semgrep report what
# the pull request adds relative to its base. The findings that already exist
# are a triage backlog (run it with workflow_dispatch to see the full list),
# not a reason to block every PR until they are gone.
#
# Not a required context yet (see .github/required-checks.json). It becomes one
# once a few weeks of runs show the rulesets are quiet on ordinary changes.
name: SAST

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The baseline scan checks out the base commit, so the history to it
          # must be present.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: pip install semgrep==1.178.0
      - name: Semgrep (new findings fail the PR)
        env:
          SEMGREP_SEND_METRICS: 'off'
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          args=(--config p/javascript --config p/typescript --config p/nodejsscan
                --config p/python --config p/dockerfile --config p/github-actions
                --metrics off --timeout 60
                # Severity INFO is advice (e.g. "consider a rate limit"), not a
                # finding; tests build hostile input on purpose.
                --severity WARNING --severity ERROR
                --exclude '*.test.js' --exclude '*.test.mjs'
                --exclude '*.test.ts' --exclude '*.test.tsx')
          if [ -n "$BASE_SHA" ]; then
            semgrep scan "${args[@]}" --error --baseline-commit "$BASE_SHA"
          else
            # workflow_dispatch: the full backlog, reported, not gated.
            semgrep scan "${args[@]}"
          fi
