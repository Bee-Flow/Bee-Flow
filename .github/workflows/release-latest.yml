# Publishing a GitHub Release moves :latest.
#
#   Releases → Draft a new release → tag v<something> on main → Publish
#
# Every push to main already builds the images that changed and tags them
# :dev-sha-<commit> (build-push-ghcr.yml). This workflow builds nothing: for
# each service it takes the newest of those images at or before the release
# commit, and tags that exact manifest :latest, :prod and :<release tag>. So a
# service that did not change in the release commit itself still ships the
# image it had at that point, never one from a later commit.
#
# Only product releases count: a published, non-prerelease release whose tag
# starts with `v`. The Android (android-*) and Learning Center (learn-media)
# releases on the same page never move a server image.
#
# The heavier route (build-push-ghcr.yml channel=prod → staging validation →
# promote-release.yml) still exists for releases that need that evidence; both
# write the same tags, so the last one to run wins.
name: Release images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish as :latest again (e.g. v2026.10.09)'
        required: true
      installer_only:
        description: 'Repair the installer of the current latest release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-latest
  cancel-in-progress: false

jobs:
  latest:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && !inputs.installer_only)
      || (github.event_name == 'release' && !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      IMAGE_PREFIX: ghcr.io/bee-flow
    steps:
      - name: Check the tag before it reaches git or the registry
        run: |
          set -euo pipefail
          # A Docker tag is at most 128 characters of [A-Za-z0-9_.-].
          if [[ ! "$TAG" =~ ^v[A-Za-z0-9_.-]{1,127}$ ]]; then
            echo "::error::Release tag '$TAG' must start with v and contain only letters, digits, '.', '_' or '-'."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned crane
        env:
          CRANE_VERSION: v0.20.2
          CRANE_SHA256: c14340087103ba9dadf61d45acd20675490fd0ccbd56ac7901fc1b502137f44b
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/crane.tar.gz" "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  $RUNNER_TEMP/crane.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/crane.tar.gz" -C "$RUNNER_TEMP" crane
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Find each service's image at the release commit
        run: |
          set -euo pipefail
          SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::Release tag $TAG points at $SHA, which is not on main. Only main is built per commit."
            exit 1
          fi
          # Newest first. 500 first-parent commits is months of main; a service
          # not built in that window keeps whatever :latest it has.
          git rev-list --first-parent --max-count=500 "$SHA" > "$RUNNER_TEMP/commits.txt"

          # server, agent-hub and pwt-runner must be found; the rest ship when
          # this repository has built them.
          REQUIRED="server agent-hub pwt-runner"
          SERVICES="server agent-hub pwt-runner guard classify"
          : > "$RUNNER_TEMP/plan.txt"
          for svc in $SERVICES; do
            if ! crane ls "${IMAGE_PREFIX}/${svc}" > "$RUNNER_TEMP/tags.txt" 2>/dev/null; then
              : > "$RUNNER_TEMP/tags.txt"
            fi
            commit=""
            while IFS= read -r c; do
              if grep -qxF "dev-sha-${c}" "$RUNNER_TEMP/tags.txt"; then commit="$c"; break; fi
            done < "$RUNNER_TEMP/commits.txt"
            if [[ -z "$commit" ]]; then
              if [[ " $REQUIRED " == *" $svc "* ]]; then
                echo "::error::No ${svc} image built at or before ${SHA:0:9} in the last 500 commits on main."
                exit 1
              fi
              echo "::notice::${svc}: no image built at or before ${SHA:0:9}; its :latest stays where it is."
              continue
            fi
            digest="$(crane digest "${IMAGE_PREFIX}/${svc}:dev-sha-${commit}")"
            echo "${svc} ${commit} ${digest}" >> "$RUNNER_TEMP/plan.txt"
          done

          # The browser sidecar's Playwright must match the server's
          # (scripts/check-playwright-lockstep.mjs), and build-push-ghcr.yml
          # builds the runner whenever it builds the server, so the two always
          # come from the same commit.
          server_commit="$(awk '$1=="server"{print $2}' "$RUNNER_TEMP/plan.txt")"
          runner_commit="$(awk '$1=="pwt-runner"{print $2}' "$RUNNER_TEMP/plan.txt")"
          if [[ "$server_commit" != "$runner_commit" ]]; then
            echo "::error::server is from ${server_commit:0:9} but pwt-runner from ${runner_commit:0:9}; they must ship together."
            exit 1
          fi
          cat "$RUNNER_TEMP/plan.txt"

      - name: Tag the images without rebuilding
        run: |
          set -euo pipefail
          # Every tag is written only after every image above was found.
          {
            echo "### Release ${TAG}"
            echo
            echo "| Image | Built from | Digest |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r svc commit digest; do
            ref="${IMAGE_PREFIX}/${svc}@${digest}"
            for t in "$TAG" prod latest; do
              crane tag "$ref" "$t"
            done
            echo "| \`${svc}\` | \`${commit:0:9}\` | \`${digest}\` |" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/plan.txt"

  # The installer of this release, as a file of the release itself:
  # `releases/latest/download/beeflow-install.sh` is the address the docs and
  # the Nextcloud connector's setup page give. One script, the same for
  # everybody, with its checksum next to it. A tag from before the installer
  # existed has no such file and is left as it is.
  installer:
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
      || (!github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      IMAGE: ghcr.io/bee-flow/installer
    steps:
      - name: Check the tag
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[A-Za-z0-9_.-]{1,127}$ ]]; then
            echo "::error::Release tag '$TAG' must start with v and contain only letters, digits, '.', '_' or '-'."
            exit 1
          fi

      - name: Verify the release before repairing its latest installer
        if: ${{ inputs.installer_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [[ "$TAG" != "$latest" ]]; then
            echo "::error::Installer repair requires the current latest release ($latest)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: release_source
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      # A release from before the installer existed has nothing to publish here.
      - name: Does this release carry the installer?
        id: has
        run: |
          set -euo pipefail
          if [ -f beeflow-install.sh ] && [ -f installer/Dockerfile ]; then
            echo "installer=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TAG has no installer: nothing to attach or build."
          fi

      # The files a self-hosted install is made of, with their checksums.
      # beeflow-install.sh verifies the other three against SHA256SUMS; the
      # separate .sha256 is what the documented download commands check.
      - name: Attach the self-host files and their checksums to the release
        if: ${{ steps.has.outputs.installer == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash -n beeflow-install.sh
          bash -n selfhost.sh
          sha256sum beeflow-install.sh selfhost.sh docker-compose.from-registry.yml .env.selfhost.example > SHA256SUMS
          sha256sum beeflow-install.sh > beeflow-install.sh.sha256
          # GitHub normalizes leading dots in asset names. Use its stable public
          # name on upload and keep the installed name in SHA256SUMS.
          cp .env.selfhost.example "$RUNNER_TEMP/default.env.selfhost.example"
          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets')"
          for file in beeflow-install.sh beeflow-install.sh.sha256 selfhost.sh docker-compose.from-registry.yml "$RUNNER_TEMP/default.env.selfhost.example" SHA256SUMS; do
            name="${file##*/}"
            remote="$(jq -r --arg name "$name" '.[] | select(.name == $name) | .digest' <<< "$assets")"
            if [[ -n "$remote" ]]; then
              expected="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
              if [[ "$remote" != "$expected" ]]; then
                echo "::error::Published $name differs from the release tag. Check the asset before replacing it."
                exit 1
              fi
              continue
            fi
            gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
          done

      # The same script as a container that carries this release's files.
      - name: Stage the image's files
        if: ${{ steps.has.outputs.installer == 'true' }}
        run: bash scripts/stage-installer-context.sh

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: ${{ steps.has.outputs.installer == 'true' }}

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: ${{ steps.has.outputs.installer == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the installer image
        if: ${{ steps.has.outputs.installer == 'true' }}
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./installer
          push: true
          build-args: |
            BEEFLOW_VERSION=${{ env.TAG }}
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ steps.release_source.outputs.commit }}

      # "Latest" on the releases page is what the documented download address
      # (releases/latest/download/…) follows. Say it here, so a release of
      # another kind published in between does not take it over for long.
      - name: Mark this release as the latest
        if: ${{ github.event_name == 'release' && steps.has.outputs.installer == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --latest --repo "$GITHUB_REPOSITORY"
