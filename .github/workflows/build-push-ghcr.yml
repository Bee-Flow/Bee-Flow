  # ── Reranker (CPU cross-encoder) ────────────────────────────
  reranker:
    needs: [changes, ci]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success'
      && (needs.ci.result == 'success' || (needs.ci.result == 'skipped' && needs.changes.outputs.ci_verified == 'true'))
      && needs.changes.outputs.reranker == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/reranker
          tags: |
            type=sha,format=long,enable=${{ needs.changes.outputs.release_prod == 'true' }}
            type=raw,value=latest,enable=${{ needs.changes.outputs.release_prod == 'true' }}
            type=raw,value=prod,enable=${{ needs.changes.outputs.release_prod == 'true' }}
            type=raw,value=dev,enable=${{ needs.changes.outputs.release_dev == 'true' }}
            type=sha,format=long,prefix=dev-sha-,enable=${{ needs.changes.outputs.release_dev == 'true' }}
      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./reranker
          push: true
          provenance: true
          sbom: true
          secrets: |
            "HF_TOKEN=${{ secrets.HF_TOKEN }}"
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # mode=min: only the runtime stage's layers go to the Actions cache,
          # not the builder stage's torch + optimum install (~1 GB) that exists
          # only to export the ONNX graph. The worst case is a reranker build
          # that re-runs that export for a few minutes; the 1 GB no longer sits
          # in the one 10 GB pool every other job's cache shares.
          cache-from: type=gha,scope=reranker
          cache-to:   type=gha,scope=reranker,mode=min

  # ── Playwright runner / shared browser (pwt-runner) ─────────
  # Backs the Studio test runner AND the long-lived shared-browser "serve" pod
  # (`bf-browser`) used for PDF export, thumbnails and SPA ingestion on Kapsule,
  # where there is no docker socket for the server to build/launch it itself.
  # MUST stay pinned to the server's Playwright version (chromium.connect() 428s
  # on a minor mismatch) — the image's base tag and server/package.json move
  # together.
  pwt-runner:
    needs: [changes, ci]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success'
      && (needs.ci.result == 'success' || (needs.ci.result == 'skipped' && needs.changes.outputs.ci_verified == 'true'))
      && needs.changes.outputs.pwt-runner == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The lockstep above, checked where a one-sided bump would ship: a runner
      # image whose Playwright differs from the server's is refused here, before
      # it can become the bf-browser every server connects to. The server job
      # runs the same script, because this job does not fire on a bump of
      # server/package.json alone. Dependabot moves neither side by version
      # (.github/dependabot.yml), so this catches a hand edit that bumped one
      # file and not the others.
      - name: Playwright versions agree (base image, runner, server)
        run: node scripts/check-playwright-lockstep.mjs
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/pwt-runner
          tags: |
            type=sha,format=long,enable=${{ needs.changes.outputs.release_prod == 'true' }}
            type=raw,value=latest,enable=${{ needs.changes.outputs.release_prod == 'true' }}
            type=raw,value=prod,enable=${{ needs.changes.outputs.release_prod == 'true' }}
            type=raw,value=dev,enable=${{ needs.changes.outputs.release_dev == 'true' }}
            type=sha,format=long,prefix=dev-sha-,enable=${{ needs.changes.outputs.release_dev == 'true' }}
      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./server/pwt-runner
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pwt-runner
          cache-to:   type=gha,scope=pwt-runner,mode=max

  # ── Release notes (BOTH channels) ──────────────────────────
  # Drafts customer-facing notes for this range and files them in the app as a
  # DRAFT. Nothing here reaches the public site: an editor publishes from
  # Admin → Release notes.
  #
  # Unlike `release` below, this runs on dev too — a dev build refreshes the one
  # rolling "Unreleased" entry rather than creating a note per merge, so the
  # draft is always current without becoming a stream of near-empty entries.
  #
  # ── Where the model runs, and why it moved ────────────────────────────────
  # With ANTHROPIC_API_KEY set, drafting happens HERE (Claude Sonnet 5, via
  # scripts/release-notes/draft.js) and the finished entry is POSTed to the app.
  # That is what puts real notes in the GitHub Release body below: the Release is
  # cut minutes later in this same run, and the runner cannot read a draft back
  # out of the app.
  #
  # Without the key, the raw git material is POSTed instead and the app drafts it
  # server-side exactly as before — the Release body then falls back to GitHub's
  # own generated commit list. Both paths share one prompt and one schema
  # (server/core/releaseNotesFormat.js), so the stored entry is identical either
  # way. Every step below degrades to that fallback rather than failing.
  #
  # Either way the runner sends commit SUBJECTS, PR titles and a diffSTAT — never
  # the diff. The diff is large, and it is exactly the payload that would carry a
  # stray credential to a model.
  #
  # BEST-EFFORT THROUGHOUT. A changelog must never be the reason a build fails.
  release-notes:
    needs: [changes, ci, server, agent-hub, search-api, search-gpu, guard, pii, classify, whisperx, wizard, reranker, pwt-runner]
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # ANTHROPIC_API_KEY and RELEASE_NOTES_TOKEN can live in the `release`
    # environment, restricted to main. Only runs ON main enter it: this job
    # also runs for a manual dev build from any branch, and an environment
    # restricted to main would fail such a job outright. Elsewhere the name is
    # empty, which means no environment: those secrets are then out of reach
    # and every step below falls back as it does without them.
    environment: ${{ github.ref == 'refs/heads/main' && 'release' || '' }}
    outputs:
      summary: ${{ steps.notes.outputs.summary }}
      notes_md: ${{ steps.draft.outputs.notes_md }}
    steps:
      # Full history + tags: the range is "since the last prod release", and the
      # default checkout is a shallow clone with no tags at all.
      # persist-credentials: false: every git command here is local, and the
      # steps that hold the API key and the ingest token have no use for a
      # GITHUB_TOKEN left in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      # ── 1. Collect the range's raw git material ──────────────────────────
      # Unconditional: the Release body wants notes even when the app-side
      # ingest token is unset, so this no longer hangs off RELEASE_NOTES_TOKEN.
      - id: material
        env:
          CHANNEL: ${{ needs.changes.outputs.release_prod == 'true' && 'prod' || 'dev' }}
          BUILT_CSV: ${{ needs.changes.outputs.built_csv }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -uo pipefail

          # Range: previous production tag → HEAD. With no prod tag yet (a fresh
          # repo), fall back to the last 50 commits rather than the entire history.
          PREV="$(git describe --tags --match 'prod-*' --abbrev=0 2>/dev/null || true)"
          if [[ -n "$PREV" ]]; then RANGE="$PREV..HEAD"; else RANGE="HEAD~50..HEAD"; fi
          echo "Range: ${RANGE}"

          # Subjects only, and a diffSTAT rather than the diff: the diff is large
          # and is exactly the payload that carries a stray credential to a model.
          COMMITS="$(git log --no-merges --pretty=%s "$RANGE" 2>/dev/null | head -200 || true)"
          PRS="$(git log --merges --pretty=%s "$RANGE" 2>/dev/null | head -100 || true)"
          STAT="$(git diff --stat "$RANGE" 2>/dev/null | tail -40 || true)"
          FROM_SHA="$(git rev-parse "${PREV:-HEAD~50}" 2>/dev/null || echo '')"

          VERSION=""
          if [[ "$CHANNEL" == "prod" ]]; then
            VERSION="$(echo "${INPUT_VERSION:-}" | tr -d '[:space:]')"
            # Must match the `ver` step in the release job below.
            if [[ -z "$VERSION" ]]; then VERSION="prod-$(date -u +%Y.%m.%d)-${{ github.run_number }}"; fi
          fi

          jq -n \
            --arg channel "$CHANNEL" --arg version "$VERSION" \
            --arg commits "$COMMITS" --arg prs "$PRS" --arg stat "$STAT" \
            --arg services "$BUILT_CSV" --arg from "$FROM_SHA" --arg to "${{ github.sha }}" \
            '{channel:$channel, version:(if $version=="" then null else $version end),
              commitSubjects:$commits, prTitles:$prs, diffstat:$stat,
              services:$services, fromSha:$from, toSha:$to}' > payload.json

      # ── 2. Draft with Claude ─────────────────────────────────────────────
      # Writes notes.json + notes.md. Exits 0 WITHOUT notes.json when the key is
      # missing or the call fails — step 3 then posts the raw material and the
      # app drafts it instead. Never fails the build.
      #
      # The install is a step of its own so the key is never in the
      # environment of npm or of anything npm runs: `npm ci` installs exactly
      # the committed lockfile, and --ignore-scripts runs no install hook at
      # all. HAS_KEY carries only whether the secret is set, never its value.
      - id: deps
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          set -uo pipefail
          if [[ "$HAS_KEY" != "true" ]]; then
            echo "::notice::release notes: no ANTHROPIC_API_KEY — the app will draft server-side"
            exit 0
          fi
          if ! npm ci --ignore-scripts --omit=dev --no-audit --no-fund --prefix scripts/release-notes; then
            echo "::warning::release notes: npm ci failed — falling back to server-side drafting"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - id: draft
        if: steps.deps.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail

          # The script exits 0 on its own failures, but a crash BEFORE its error
          # handler is installed (a bad require, a broken install) would still
          # take the job down and skip the release job with it. Half-written
          # output is discarded so step 3 cannot post a truncated draft.
          if ! node scripts/release-notes/draft.js --material payload.json --out-dir .; then
            echo "::warning::release notes: drafter crashed — falling back to server-side drafting"
            rm -f notes.json notes.md
            exit 0
          fi
          [[ -s notes.md ]] || exit 0

          # Multi-line output: the release job below uses this verbatim as the
          # GitHub Release body. The delimiter is random per write: notes.md is
          # model output built from commit text, and a line in it equal to a
          # fixed delimiter would end the value early and let the lines after
          # it set outputs of their own.
          DELIM="EOF_$(openssl rand -hex 16)"
          {
            echo "notes_md<<${DELIM}"
            cat notes.md
            echo ""
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release notes (drafted in CI)"
            echo ""
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 3. File it in the app as a DRAFT ─────────────────────────────────
      # Sends the drafted entry when step 2 produced one, otherwise the raw
      # material for the app to draft. Publishing stays a human action.
      - id: notes
        env:
          # Where the draft goes: a repo variable, so no host is baked into this file.
          APP_URL: ${{ secrets.APP_URL || vars.RELEASE_NOTES_APP_URL }}
          NOTES_TOKEN: ${{ secrets.RELEASE_NOTES_TOKEN }}
        run: |
          set -uo pipefail
          if [[ -z "${NOTES_TOKEN:-}" ]]; then
            echo "::notice::release notes ingest skipped (RELEASE_NOTES_TOKEN not set)"
            exit 0
          fi
          if [[ -z "${APP_URL:-}" ]]; then
            echo "::notice::release notes ingest skipped (vars.RELEASE_NOTES_APP_URL not set)"
            exit 0
          fi

          BODY=payload.json
          if [[ -f notes.json ]]; then
            jq -s '.[0] + {entry: .[1]}' payload.json notes.json > ingest.json
            BODY=ingest.json
          fi

          RESP="$(curl -fsS -m 120 -X POST "${APP_URL%/}/api/release-notes/ingest" \
            -H "Authorization: Bearer ${NOTES_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data @"${BODY}")" || {
              echo "::warning::release notes ingest failed — continuing"
              exit 0
            }

          COUNT="$(echo "$RESP" | jq -r '.itemCount // 0')"
          BY="$(echo "$RESP" | jq -r '.draftedBy // "server"')"
          TITLE="$(echo "$RESP" | jq -r '.entry.title // ""')"
          LEAD="$(echo "$RESP" | jq -r '.entry.lead // ""')"
          echo "Drafted ${COUNT} item(s) by ${BY}: ${TITLE}"

          # Kept as the Release-body fallback for when step 2 did not run: the
          # app-drafted title and lead, which is what this job used to emit.
          # Random delimiter, for step 2's reason: the lead is model text.
          DELIM="EOF_$(openssl rand -hex 16)"
          {
            echo "summary<<${DELIM}"
            [[ -n "$TITLE" ]] && echo "**${TITLE}**"
            [[ -n "$LEAD" ]] && echo "" && echo "$LEAD"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release notes"
            echo ""
            if [[ "$COUNT" == "0" ]]; then
              echo "No user-visible changes in this range — nothing drafted."
            else
              echo "Filed **${COUNT}** item(s) as a DRAFT (drafted by \`${BY}\`). Publish from Admin → Release notes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── GitHub Release (PRODUCTION only) ───────────────────────
  # After a manual prod release builds & pushes the images, cut a git tag +
  # GitHub Release so it shows up under Releases. Skipped for dev builds (every
  # main merge is a continuous dev build — a Release per merge would be noise).
  release:
    needs: [changes, ci, release-notes, server, agent-hub, search-api, search-gpu, guard, pii, classify, whisperx, wizard, reranker, pwt-runner]
    # only on prod, only if no build job failed.
    if: ${{ always() && !cancelled() && needs.changes.outputs.release_prod == 'true' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create the tag + release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V="$(echo "${INPUT_VERSION:-}" | tr -d '[:space:]')"
          if [[ -z "$V" ]]; then V="prod-$(date -u +%Y.%m.%d)-${{ github.run_number }}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release version: $V"
      # Self-host bundle: the three files a no-clone install needs (the
      # "release bundle" docs/self-hosting/docker-compose.md points at), plus
      # checksums. Taken from the checkout above, i.e. the exact release
      # commit. docker/init-db.sh is not an asset — selfhost.sh materialises
      # it itself.
      - name: Checksum self-host bundle
        run: sha256sum selfhost.sh docker-compose.from-registry.yml .env.selfhost.example > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true   # auto commit/PR changelog since the last release
          # The drafted human notes go on top; GitHub appends its raw commit/PR
          # list underneath. `notes_md` is the full itemised draft written by
          # Claude in the release-notes job; `summary` is the app-drafted title
          # and lead, which is all that exists when CI has no ANTHROPIC_API_KEY.
          # Both empty (no ingest token either) leaves just GitHub's own list.
          # `built_csv` is what actually built — `inputs.services` is the raw
          # string the operator typed ("all"), which is not the same thing.
          body: |
            ${{ needs.release-notes.outputs.notes_md || needs.release-notes.outputs.summary }}

            ---
            Production release built from `${{ github.sha }}`.

            **Images** — `ghcr.io/bee-flow/<svc>` at `:prod`, `:latest`, and `:sha-${{ github.sha }}`.
            Built services: `${{ needs.changes.outputs.built_csv }}`

            **Self-host bundle** — `selfhost.sh`, `docker-compose.from-registry.yml` and `.env.selfhost.example` (+ `SHA256SUMS`) are attached below.
          files: |
            selfhost.sh
            docker-compose.from-registry.yml
            .env.selfhost.example
            SHA256SUMS
