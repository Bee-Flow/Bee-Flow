name: Promote validated release candidate
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Successful Build & Push run containing the immutable release candidate'
        required: true
      staging_run_id:
        description: 'Successful staging validation run for these exact image digests'
        required: true
      version:
        description: 'Production version, e.g. prod-2026.10.08-1'
        required: true
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: production-release-promotion
  cancel-in-progress: false
jobs:
  verify-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.acceptance.outputs.matrix }}
      commit: ${{ steps.acceptance.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: node scripts/release-workflow-evidence.mjs "$CANDIDATE_RUN_ID" .github/workflows/build-push-ghcr.yml
      - id: staging
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: node scripts/release-workflow-evidence.mjs "$STAGING_RUN_ID" .github/workflows/staging-release-validation.yml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate-${{ steps.candidate.outputs.attempt }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: staging-acceptance-${{ steps.staging.outputs.attempt }}
          run-id: ${{ inputs.staging_run_id }}
          github-token: ${{ github.token }}
      - id: acceptance
        env:
          EXPECTED_COMMIT: ${{ steps.candidate.outputs.commit }}
          EXPECTED_RUN: ${{ inputs.candidate_run_id }}
          EXPECTED_ATTEMPT: ${{ steps.candidate.outputs.attempt }}
        run: |
          node scripts/release-manifest.mjs verify release-candidate.json staging-acceptance.json
          node - <<'NODE'
          const fs=require('fs');const c=require('./release-candidate.json');
          if(c.commit!==process.env.EXPECTED_COMMIT || String(c.runId)!==process.env.EXPECTED_RUN || String(c.runAttempt)!==process.env.EXPECTED_ATTEMPT)throw Error('Candidate provenance mismatch');
          const matrix=Object.entries(c.images).map(([service,e])=>({service,ref:`${e.image}@${e.digest}`}));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`matrix=${JSON.stringify(matrix)}\ncommit=${c.commit}\n`);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-release-${{ github.run_attempt }}
          path: |
            release-candidate.json
            staging-acceptance.json
          if-no-files-found: error
      - name: Repeat dependency gate before promotion
        # Check current security policy; candidate-dependency-gate also audits
        # the lockfiles shipped in the immutable candidate.
        run: node scripts/audit-ratchet.mjs --release

  candidate-dependency-gate:
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Check the candidate lockfiles against current advisories
        run: node scripts/audit-ratchet.mjs --release

  production-container-gate:
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.verify-release.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.ref }}
          format: json
          output: container-scan.json
          severity: HIGH,CRITICAL
          scanners: vuln
          ignore-unfixed: false
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify runtime prerequisites for reachability reviews
        id: runtime
        env:
          IMAGE_REF: ${{ matrix.ref }}
          SERVICE: ${{ matrix.service }}
        run: bash scripts/check-release-container.sh "$SERVICE" "$IMAGE_REF"
      - env:
          IMAGE_REF: ${{ matrix.ref }}
          CONTAINER_RUNTIME_VERIFIED: ${{ steps.runtime.outputs.verified }}
        run: node scripts/container-release-gate.mjs container-scan.json "$IMAGE_REF"

  promote-production:
    needs: [verify-release, candidate-dependency-gate, production-container-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-release-${{ github.run_attempt }}
      - name: Verify acceptance and the requested version before registry writes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/release-manifest.mjs verify release-candidate.json staging-acceptance.json
          node -e 'if(!/^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$/.test(process.env.VERSION))throw Error("Invalid release version")'
      - name: Install pinned crane
        env:
          CRANE_VERSION: v0.20.2
          CRANE_SHA256: c14340087103ba9dadf61d45acd20675490fd0ccbd56ac7901fc1b502137f44b
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/crane.tar.gz" "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  $RUNNER_TEMP/crane.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/crane.tar.gz" -C "$RUNNER_TEMP" crane
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote the scanned manifests without rebuilding
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node scripts/release-manifest.mjs verify release-candidate.json staging-acceptance.json > verified-images.txt
          # Check all source manifests before changing any production tag.
          while IFS= read -r image; do
            test "$(crane digest "$image")" = "${image##*@}"
          done < verified-images.txt
          while IFS= read -r image; do
            crane tag "$image" "$VERSION"
            crane tag "$image" "sha-$(jq -r .commit release-candidate.json)"
            crane tag "$image" prod
            crane tag "$image" latest
          done < verified-images.txt
      - run: sha256sum selfhost.sh docker-compose.from-registry.yml .env.selfhost.example release-candidate.json staging-acceptance.json > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ needs.verify-release.outputs.commit }}
          generate_release_notes: true
          files: |
            selfhost.sh
            docker-compose.from-registry.yml
            .env.selfhost.example
            release-candidate.json
            staging-acceptance.json
            SHA256SUMS
