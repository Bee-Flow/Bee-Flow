# Secret scanning as a PR gate — the same scripts developers run locally
# (npm run lint:gitleaks / lint:secrets / lint:checks), so local == CI:
#   scripts/scan-secrets.sh          gitleaks over git-tracked files, honoring
#                                    .gitleaks.toml (falls back to a regex scan
#                                    when gitleaks is absent — CI installs it
#                                    below so the full ruleset always runs);
#                                    with --range, over the commits a PR or a
#                                    push adds
#   scripts/check-no-test-secrets.sh test-fixture secret assignments must stay
#                                    inside test files
#   check-required-checks.mjs        the contexts in .github/required-checks.json
#                                    must each be emitted by exactly one job
#
# `scan` is a required status check of repo ruleset 23605458 (mirrored in
# .github/required-checks.json): a change reaches main only through a pull
# request that is up to date and has `scan` green, and nobody can bypass it.
name: Secret scan

on:
  pull_request:
  # A push to main runs it too, as belt and braces. The ruleset already made
  # the change pass `scan` in its pull request; this run records the verdict
  # on the exact main commit build-push-ghcr.yml builds :dev images from, and
  # it still scans if the ruleset stops being enforced, which happened while
  # the org sat on GitHub's Free plan (no rulesets for a private repository).
  # main only, not develop as well: a PR FROM a pushed branch would then
  # carry two `scan` runs on its head commit, the non-unique-context hazard
  # check-required-checks.mjs exists for. No develop branch exists today.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the range scan below reads the patches of every commit
      # between the base and the head, which a depth-1 clone does not have
      # (~100 MiB of packs, a few seconds).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Pinned by version AND sha256 — a compromised release asset fails the
      # checksum instead of running.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
          rm gitleaks.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # A failing run lists rule, file and line per finding, never the value
      # (see the comment in the script).
      - name: Scan tracked files (gitleaks)
        run: ./scripts/scan-secrets.sh

      # The commits, not only the tree. A secret added in one commit and
      # deleted in the next never reaches the tree scan above, but a
      # non-squash merge carries it into main's history for good, where it
      # has to be rotated. Revisions come in through env, never spliced into
      # the script. A push whose `before` is not in the clone (a new branch,
      # a force push) has no range to read; the tree scan above still ran.
      # On a pull_request a missing revision is an error, not a skip.
      - name: Scan the commits this PR or push adds (gitleaks)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          EVENT: ${{ github.event_name }}
          FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ] && ! git cat-file -e "${FROM}^{commit}" 2>/dev/null; then
            echo "::notice::no commit range to scan for this push (before=${FROM}); the tree scan covered it"
            exit 0
          fi
          ./scripts/scan-secrets.sh --range "${FROM}..${TO}"

      - name: Test-fixture secrets stay in test files
        run: ./scripts/check-no-test-secrets.sh

      # No setup-node: `npm run` and `node` are both on the ubuntu-latest image
      # and the script below has no dependency, so nothing is installed.
      # This workflow is one of only two PR-triggered ones with no paths:
      # filter, which is why the universal guard lives here.
      #
      # ONLY lint:checks, and deliberately. `scan` is one of the three
      # contexts ruleset 23605458 requires, so every step added here is a new
      # way to block every merge in the repo. lint:checks earns its place:
      # what it asserts — that each required context is emitted by exactly one
      # job — IS a merge-gating correctness property, and it costs 0.2 s.
      # The repo-script unit tests do NOT earn it: `npm run test:scripts`
      # globs scripts/*.test.mjs, so adding a workflow without bucketing it in
      # check-workflow-concurrency.mjs would have turned the required context
      # red. That gate has its own non-required home (workflow-policy.yml),
      # which is where it stays.
      - name: Required status checks stay unambiguous
        run: npm run lint:checks
