# The pins live here and nowhere else: uv.lock resolves them to exact
# versions plus hashes, and the Dockerfile installs from that lock, so a
# rebuild months from now gets the same wheels as this one.
[project]
name = "beeflow-reranker"
version = "0.0.0"
description = "Cross-encoder search reranking over ONNX Runtime"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "numpy==2.4.6",
    "onnxruntime==1.30.0",
    "pydantic-settings==2.15.0",
    "transformers==5.17.0",
    "uvicorn[standard]==0.53.0",
]

[tool.uv]
# The service is a script on a path, not an installable distribution, so uv
# resolves the dependencies without trying to build reranker.py into a wheel.
package = false

[tool.coverage.run]
# The tests sit next to the one module they cover; only the module counts.
omit = ["*/tests/*"]
