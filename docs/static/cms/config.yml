# Sveltia CMS configuration — Bee Flow docs.
#
# Drop-in compatible with Decap CMS config syntax.
# Source-of-truth lives in: docs/static/cms/config.yml
#
# Each collection below maps 1:1 to a top-level section under docs/.

backend:
  name: github
  repo: Bee-Flow/docs
  branch: main
  # OAuth helper that performs the GitHub code -> token exchange.
  # We self-host a tiny Cloudflare Worker for this — code lives in
  # ../../cms-auth/. Setup steps: cms-auth/README.md.
  #
  # Until the worker is deployed, swap this for `https://auth.sveltia.app`
  # to use Sveltia's shared helper (less control, third-party dependency).
  base_url: https://bee-flow-cms-auth.bee-flow-cms-auth.workers.dev

site_url: https://docs.beeflow.ai/
display_url: https://docs.beeflow.ai/
logo_url: /img/logo.svg

# Where uploaded media is stored in the repo, and what URL prefix gets written
# into Markdown when an image is referenced.
media_folder: docs/img/uploads
public_folder: /img/uploads

# Editor sees the rendered site for each saved entry.
show_preview_links: true

# Re-usable field set: every doc page has the same shape (front-matter + body).
# Defined inline below so non-technical editors don't see YAML anchors.

collections:
  # ---- Top-level docs sections ----------------------------------------------

  - name: getting-started
    label: Getting started
    label_singular: page
    description: Install, first-run wizard, free vs paid features.
    folder: docs/getting-started
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    preview_path: "getting-started/{{slug}}"
    fields:
      - {label: Title, name: title, widget: string, required: false}
      - {label: Description, name: description, widget: string, required: false, hint: "One sentence shown in search results."}
      - {label: Body, name: body, widget: markdown}

